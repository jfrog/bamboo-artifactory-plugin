# Ported from ci/release/pipelines.release.yml (JFrog Pipelines "release_bamboo", now EOL).
#
# Deliberate behavior change: JFrog CLI is installed via the jfrog/setup-jfrog-cli@v4
# action instead of `curl -fL https://install-cli.jfrog.io | sh`. All `env -i ...`
# sanitization tricks from the original pipeline have been dropped as unnecessary
# in a GitHub Actions runner.
name: Release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Version to release (e.g. 3.4.0)"
        required: true
        type: string
      next_development_version:
        description: "Next development version (e.g. 3.4.x-SNAPSHOT)"
        required: true
        type: string

env:
  CI: true
  JFROG_BUILD_STATUS: PASS
  JFROG_CLI_BUILD_NAME: ecosystem-artifactory-bamboo-plugin-release
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
  JFROG_CLI_BUILD_PROJECT: ecosys
  NEXT_VERSION: ${{ inputs.next_version }}
  NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.IL_AUTOMATION_TOKEN }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_USER: ${{ secrets.ARTIFACTORY_USER }}
          JF_PASSWORD: ${{ secrets.ARTIFACTORY_APIKEY }}

      - name: Configure git identity
        run: |
          git config user.name "jfrog-ecosystem-automation"
          git config user.email "eco-system@jfrog.com"

      - name: Checkout release branch
        run: |
          git fetch origin release
          git checkout release

      # Make sure versions were provided
      - name: Check variables
        run: |
          test -n "$NEXT_VERSION"
          test -n "$NEXT_DEVELOPMENT_VERSION"

      - name: Configure JFrog CLI Maven config
        run: |
          jf mvnc \
            --repo-resolve-releases ecosys-bamboo-repos --repo-resolve-snapshots ecosys-releases-snapshots \
            --repo-deploy-snapshots ecosys-oss-snapshot-local --repo-deploy-releases ecosys-oss-release-local

      - name: Run audit
        run: jf audit

      - name: Sync changes with master
        run: git merge origin/master

      - name: Update version
        run: jf mvn versions:set -DnewVersion="${NEXT_VERSION}" -B

      - name: Commit and tag release version
        run: |
          git commit -am "[artifactory-release] Release version ${NEXT_VERSION} [skipRun]" --allow-empty
          git tag "${NEXT_VERSION}"

      - name: Push release commit and tag
        run: |
          git push origin release
          git push origin --tags

      - name: Build and publish
        run: jf mvn clean install -U -B

      - name: Publish build info
        run: |
          jf rt bag
          jf rt bce
          jf rt bp

      - name: Distribute release bundle
        run: |
          jf ds rbc ecosystem-artifactory-bamboo-plugin "$NEXT_VERSION" --spec=./ci/release/specs/prod-rbc-filespec.json --spec-vars="version=$NEXT_VERSION" --sign
          jf ds rbd ecosystem-artifactory-bamboo-plugin "$NEXT_VERSION" --site="releases.jfrog.io" --sync

      - name: Merge release into master
        run: |
          git checkout master
          git merge origin/release

      - name: Update next development version
        run: jf mvn versions:set -DnewVersion="$NEXT_DEVELOPMENT_VERSION" -B

      # Remove build artifacts (e.g. target/) left over from the release build above,
      # so they aren't picked up by the next-development-version commit.
      - name: Clean build artifacts
        run: git clean -fd

      - name: Commit next development version
        run: |
          git commit -am "[artifactory-release] Next development version [skipRun]"
          git push origin master
